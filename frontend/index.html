<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ランニング記録管理App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">AI-powered training workspace</p>
        <h1>ランニング記録管理</h1>
        <p class="subtitle">個人的なランニング記録を管理</p>
      </div>
    </header>

    <main class="dashboard-grid">
      <!-- RECORDS SECTION -->
      <div class="section-group records-group">
        <section class="card hero-card">
          <div class="card-header">
            <div>
              <p class="eyebrow">記録一覧</p>
              <h2>最新のランニング結果</h2>
            </div>
            <button id="loadRecordsBtn" class="primary-btn">表示</button>
          </div>
          <div id="recordTableContainer" class="table-block">「表示」ボタンを押すか、データを読み込んでください。</div>
        </section>

        <section class="card">
          <div class="card-header">
            <div>
              <p class="eyebrow">記録の追加</p>
              <h2>新しい結果を登録</h2>
            </div>
          </div>
          <form id="recordForm" class="form-grid">
            <label>
              <span>player_id</span>
              <input id="recordPlayerId" type="number" placeholder="player_id" required>
            </label>

            <label>
              <span>種目</span>
              <select id="distanceId" required>
                <option value="">選択してください</option>
                <option value="1">1000m</option>
                <option value="2">1500m</option>
                <option value="3">3000m</option>
              </select>
            </label>

            <label>
              <span>記録</span>
              <input id="recordTime" type="text" placeholder="00:00:00" required>
            </label>

            <label>
              <span>日付</span>
              <input id="runDate" type="date" required>
            </label>

            <label class="full-width">
              <span>備考</span>
              <input id="recordNotes" type="text" placeholder="備考">
            </label>

            <button type="submit" class="primary-btn full-width">追加</button>
          </form>
        </section>

      <section class="card">
        <div class="card-header">
          <div>
            <p class="eyebrow">Players管理</p>
            <h2>新しい選手を追加</h2>
          </div>
          <div id="playerTableContainer" class="table-block">読み込み中...</div>
        </section>

        <section class="card">
          <div class="card-header">
            <div>
              <p class="eyebrow">Players管理</p>
              <h2>新しい選手を追加</h2>
            </div>
          </div>
          <form id="playerForm" class="form-grid">
            <label>
              <span>player_id</span>
              <input id="newPlayerId" type="number" placeholder="player_id" required>
            </label>

            <label>
              <span>名前</span>
              <input id="newPlayerName" type="text" placeholder="名前" required>
            </label>

            <label>
              <span>性別</span>
              <select id="newPlayerGender" required>
                <option value="">選択してください</option>
                <option value="男">男</option>
                <option value="女">女</option>
              </select>
            </label>

      <section class="card">
        <div class="card-header">
          <div>
            <p class="eyebrow">Players一覧</p>
            <h2>登録済み選手</h2>
          </div>
          <form id="deletePlayerForm" class="inline-form">
            <input id="deletePlayerId" type="number" placeholder="player_id" required>
            <button type="submit" class="secondary-btn">削除</button>
          </form>
        </section>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
