<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>webアプリ</title>
</head>
<body>
  <div>
    <button id="showJson">表示</button>
  </div>
  <div id="tableContainer">「表示」ボタンを押すか、データを読み込んでください。</div>
  <h3>記録の追加</h3>

  <form id="recordForm">

    <input
      id="player_id"
      type="number"
      placeholder="player_id">

    <select id="distance_id">
  <option value="1">1000m</option>
  <option value="2">1500m</option>
  <option value="3">3000m</option>
</select>

    <input
      id="record"
      type="text"
      placeholder="00:00:00">

    <input
      id="run_date"
      type="date">

    <input
      id="notes"
      type="text"
      placeholder="備考">

    <button type="submit">
      追加
    </button>

  </form>

  <h3>記録の削除</h3>

  <form id="deleteForm">

    <input
      id="deleteId"
      type="number"
      placeholder="idを入力">

    <button type="submit">
      削除
    </button>
  </form>

  <hr>

<h3>Players追加</h3>

<form id="playerForm">

  <input
    id="player_id_input"
    type="number"
    placeholder="player_id">

  <input
    id="player_name"
    type="text"
    placeholder="名前">

  <select id="gender">
    <option value="男">男</option>
    <option value="女">女</option>
  </select>

  <button type="submit">
    追加
  </button>

</form>
<h3>Players削除</h3>

<form id="playerDeleteForm">

  <input
    id="deletePlayerId"
    type="number"
    placeholder="player_id">

  <button type="submit">
    削除
  </button>

</form>

<h3>Players一覧</h3>

<div id="playerTableContainer">
  読み込み中...
</div>

  <script src="app.js"></script>
</body>
</html>
