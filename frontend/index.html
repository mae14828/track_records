<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ランニング記録管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">AI-powered training workspace</p>
        <h1>ランニング記録管理</h1>
        <p class="subtitle">今日の記録をすばやく確認して、次の一歩へつなげましょう。</p>
      </div>
      <button id="showJson" class="primary-btn">表示</button>
    </header>

    <main class="dashboard-grid">
      <section class="card hero-card">
        <div class="card-header">
          <div>
            <p class="eyebrow">記録一覧</p>
            <h2>最新のランニング結果</h2>
          </div>
        </div>
        <div id="tableContainer" class="table-block">「表示」ボタンを押すか、データを読み込んでください。</div>
      </section>

      <section class="card">
        <div class="card-header">
          <div>
            <p class="eyebrow">記録の追加</p>
            <h2>新しい結果を登録</h2>
          </div>
        </div>
        <form id="recordForm" class="form-grid">
          <label>
            <span>player_id</span>
            <input id="player_id" type="number" placeholder="player_id">
          </label>

          <label>
            <span>種目</span>
            <select id="distance_id">
              <option value="1">1000m</option>
              <option value="2">1500m</option>
              <option value="3">3000m</option>
            </select>
          </label>

          <label>
            <span>記録</span>
            <input id="record" type="text" placeholder="00:00:00">
          </label>

          <label>
            <span>日付</span>
            <input id="run_date" type="date">
          </label>

          <label class="full-width">
            <span>備考</span>
            <input id="notes" type="text" placeholder="備考">
          </label>

          <button type="submit" class="primary-btn full-width">追加</button>
        </form>
      </section>

      <section class="card">
        <div class="card-header">
          <div>
            <p class="eyebrow">記録の削除</p>
            <h2>不要な結果を削除</h2>
          </div>
        </div>
        <form id="deleteForm" class="inline-form">
          <input id="deleteId" type="number" placeholder="idを入力">
          <button type="submit" class="secondary-btn">削除</button>
        </form>
      </section>

      <section class="card">
        <div class="card-header">
          <div>
            <p class="eyebrow">Players管理</p>
            <h2>新しい選手を追加</h2>
          </div>
        </div>
        <form id="playerForm" class="form-grid">
          <label>
            <span>player_id</span>
            <input id="player_id_input" type="number" placeholder="player_id">
          </label>

          <label>
            <span>名前</span>
            <input id="player_name" type="text" placeholder="名前">
          </label>

          <label>
            <span>性別</span>
            <select id="gender">
              <option value="男">男</option>
              <option value="女">女</option>
            </select>
          </label>

          <button type="submit" class="primary-btn full-width">追加</button>
        </form>
      </section>

      <section class="card">
        <div class="card-header">
          <div>
            <p class="eyebrow">Players管理</p>
            <h2>選手を削除</h2>
          </div>
        </div>
        <form id="playerDeleteForm" class="inline-form">
          <input id="deletePlayerId" type="number" placeholder="player_id">
          <button type="submit" class="secondary-btn">削除</button>
        </form>
      </section>

      <section class="card">
        <div class="card-header">
          <div>
            <p class="eyebrow">Players一覧</p>
            <h2>登録済み選手</h2>
          </div>
        </div>
        <div id="playerTableContainer" class="table-block">読み込み中...</div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
